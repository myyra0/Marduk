name: Rust

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  native:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
          - os: windows-2025
            host: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Check native toolchain
        env:
          EXPECTED_HOST: ${{ matrix.host }}
        run: |
          export LC_ALL=C
          rustc_info="$(rustc -Vv | tr -d '\r')"
          printf '%s\n' "$rustc_info"
          grep -Fx "host: $EXPECTED_HOST" <<< "$rustc_info"
          cargo --version
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - name: Run qualified staging on tmpfs
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo mkdir -p /mnt/marduk-tmpfs
          sudo mount -t tmpfs -o size=512m tmpfs /mnt/marduk-tmpfs
          TMPDIR=/mnt/marduk-tmpfs cargo test -p marduk-storage --test qualified_stage -- --ignored --test-threads=1
      - name: Unmount tmpfs
        if: always()
        run: sudo umount /mnt/marduk-tmpfs || true
  desktop-frontend:
    name: Desktop frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run test
        working-directory: app
      - run: npm run build
        working-directory: app

  desktop-native:
    name: Desktop native build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install WebKitGTK build dependencies
        if: matrix.os != 'windows-2025'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      # Links the real shell: this is the first gate that proves the desktop
      # binary builds, not just that the crate type-checks.
      - run: cargo build --manifest-path app/src-tauri/Cargo.toml --locked
