[package]
name = "marduk-platform"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
marduk-archive = { path = "../archive" }
marduk-core = { path = "../core" }
sha2 = { version = "=0.11.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "=0.2.189", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = [
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "=3.27.0"
