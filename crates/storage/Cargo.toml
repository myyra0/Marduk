[package]
name = "marduk-storage"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Enables the test-only evidence entry points that skip the availability check
# for a deploy-round-trip run. Off by default; product builds must not enable it.
evidence = ["marduk-platform/evidence"]

[dependencies]
marduk-core = { path = "../core" }
marduk-platform = { path = "../platform" }
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled"] }
sha2 = { version = "=0.11.1", default-features = false }

[dev-dependencies]
marduk-archive = { path = "../archive" }
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled"] }
tempfile = "=3.27.0"
