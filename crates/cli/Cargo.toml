[package]
name = "marduk-cli"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "marduk"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.9", features = ["derive"] }
marduk-workspace = { path = "../workspace" }
serde_json = "=1.0.154"

[dev-dependencies]
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled"] }
tempfile = "=3.27.0"
