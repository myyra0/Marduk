[package]
name = "marduk-workspace"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Test-only entry points for the deploy evidence harness; off by default.
evidence = ["marduk-storage/evidence"]

[dependencies]
dirs = "=7.0.0"
marduk-core = { path = "../core" }
marduk-games = { path = "../games" }
marduk-platform = { path = "../platform" }
marduk-storage = { path = "../storage" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[dev-dependencies]
tempfile = "=3.27.0"
