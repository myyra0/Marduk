[package]
name = "marduk-desktop"
version = "0.1.0"
description = "Marduk desktop client"
edition = "2024"
publish = false

[workspace]
resolver = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
marduk-workspace = { path = "../../crates/workspace" }

[dev-dependencies]
tempfile = "=3.27.0"
